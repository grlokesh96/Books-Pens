name: DevSecOps Pipeline - Books-Pens (Production)

on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "*.md"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do?"
        required: true
        default: "scan-only"
        type: choice
        options:
          - scan-only
          - deploy
          - test

env:
  ECR_REPOSITORY_NAME: books-pens
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/books-pens
  EKS_CLUSTER_NAME: books-cluster
  IMAGE_TAG: v${{ github.run_number }}
  TALISMAN_VERSION: v1.32.0
  APP_PORT: 3000 # port your container listens on (used by ZAP DAST stage)

permissions:
  id-token: write
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ═══════════════════════════════════════════════════════
  # STAGE 1: SECRET SCANNING — GITLEAKS
  # ═══════════════════════════════════════════════════════
  secret-scan:
    name: "Stage 1: Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════
  # STAGE 2: SENSITIVE DATA SCANNING — TALISMAN
  # Runs in parallel with Gitleaks (second layer of secret detection)
  # ═══════════════════════════════════════════════════════
  talisman:
    name: "Stage 2: Secret Scanning (Talisman)"
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Talisman
        run: |
          curl -sSfL -o talisman \
            "https://github.com/thoughtworks/talisman/releases/download/${TALISMAN_VERSION}/talisman_linux_amd64"
          chmod +x talisman
          ./talisman --version || true

      - name: Run Talisman scan (generates report)
        id: talisman_scan
        continue-on-error: true # let the report upload even when findings exist
        run: |
          ./talisman --scan --reportDirectory=talisman_reports

      - name: Show Talisman report folders
        if: always()
        run: |
          ls -R talisman_reports 2>/dev/null || echo "No talisman_reports directory"
          ls -R talisman_html_report 2>/dev/null || echo "No talisman_html_report directory"

      - name: Upload Talisman report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: talisman-report
          path: |
            talisman_reports/
            talisman_html_report/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail pipeline if Talisman found issues
        if: steps.talisman_scan.outcome == 'failure'
        run: |
          echo "::error::Talisman detected potential secrets/sensitive data. Download the 'talisman-report' artifact for details."
          exit 1

  # ═══════════════════════════════════════════════════════
  # STAGE 3: LINTING
  # ═══════════════════════════════════════════════════════
  lint:
    name: "Stage 3: Linting (ESLint)"
    runs-on: ubuntu-latest
    needs: [secret-scan, talisman]
    # Dependabot skips the two secret scans; always() + result check keeps lint running for it
    if: >
      always() &&
      (needs.secret-scan.result == 'success' || needs.secret-scan.result == 'skipped') &&
      (needs.talisman.result == 'success' || needs.talisman.result == 'skipped')
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ═══════════════════════════════════════════════════════
  # STAGE 4: SAST — SEMGREP
  # ═══════════════════════════════════════════════════════
  semgrep:
    name: "Stage 4: SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python (for Semgrep)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install --no-cache-dir semgrep

      - name: Run Semgrep scan (SARIF)
        # --error exits 1 on findings, 0 on no-findings, 2 on crash.
        # We append || true so the workflow continues and SARIF is uploaded
        # instead of failing the job before upload. Severity gating is done
        # via the Security tab / code-scanning alerts.
        run: semgrep scan --config auto --sarif --output semgrep.sarif --error || true

      - name: Verify SARIF exists
        if: always()
        run: |
          echo "Checking for semgrep.sarif..."
          ls -lh semgrep.sarif || echo "::warning::semgrep.sarif not created by scan"
          # Guard: create minimal valid SARIF if somehow missing so upload never crashes
          if [ ! -f semgrep.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Semgrep","informationUri":"https://semgrep.dev"}},"results":[]}]}' > semgrep.sarif
            echo "Created empty fallback SARIF"
          fi
          head -n 50 semgrep.sarif || cat semgrep.sarif

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep
          wait-for-processing: true

  # ═══════════════════════════════════════════════════════
  # STAGE 5: DEPENDENCY SCAN — SCA
  # ═══════════════════════════════════════════════════════
  dependency-scan:
    name: "Stage 5: Dependency Scan (Trivy FS)"
    runs-on: ubuntu-latest
    needs: [semgrep]
    # Semgrep is skipped for Dependabot, so don't block on it
    if: always() && (needs.semgrep.result == 'success' || needs.semgrep.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan - src
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "./src"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  # ═══════════════════════════════════════════════════════
  # STAGE 6: BUILD DOCKER IMAGE
  # ═══════════════════════════════════════════════════════
  build-image:
    name: "Stage 6: Build Docker Image"
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Built Images
        run: docker images

      - name: Save Docker Image
        run: |
          docker save \
            -o books-pens.tar \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.IMAGE_NAME }}:latest

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: books-pens.tar
          retention-days: 1

  # ═══════════════════════════════════════════════════════
  # STAGE 7: CONTAINER IMAGE SCAN
  # ═══════════════════════════════════════════════════════
  image-scan:
    name: "Stage 7: Container Image Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [build-image]
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Docker Image
        run: docker load -i books-pens.tar

      - name: Verify Loaded Images
        run: docker images

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: "sarif"
          output: "trivy-image.sarif"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          scanners: "vuln"

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-image.sarif"
          category: "trivy-image"
          wait-for-processing: true

  # ═══════════════════════════════════════════════════════
  # STAGE 8: DAST — OWASP ZAP BASELINE SCAN
  # Runs the freshly built image locally and scans it
  # ═══════════════════════════════════════════════════════
  dast-zap:
    name: "Stage 8: DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: [image-scan]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Docker Image
        run: docker load -i books-pens.tar

      - name: Start application container
        run: |
          docker run -d --name books-pens-app \
            -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Wait for application to be ready
        run: |
          echo "Waiting for http://localhost:${APP_PORT} ..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" "http://localhost:${APP_PORT}" | grep -qE "^(2|3|4)[0-9]{2}$"; then
              echo "Application is up (attempt $i)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Application did not become ready in time"
          docker logs books-pens-app
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:${{ env.APP_PORT }}"
          # Optional: commit a .zap/rules.tsv to tune/ignore specific alerts
          # rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a" # also include alpha passive rules
          allow_issue_writing: false # don't auto-create GitHub issues
          fail_action: false # set to true to fail the pipeline on ZAP warnings/failures
          artifact_name: "zap-report"

      - name: Add ZAP summary to job summary
        if: always()
        run: |
          if [ -f report_md.md ]; then
            echo "## OWASP ZAP Baseline Report" >> "$GITHUB_STEP_SUMMARY"
            cat report_md.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::report_md.md not found"
          fi

      - name: Upload ZAP reports (HTML / JSON / MD)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports-all-formats
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
          retention-days: 14

      - name: Show app logs on failure
        if: failure()
        run: docker logs books-pens-app || true

      - name: Stop application container
        if: always()
        run: docker rm -f books-pens-app || true

  # ═══════════════════════════════════════════════════════
  # STAGE 9: PUSH TO DOCKER HUB
  # ═══════════════════════════════════════════════════════
  push-to-dockerhub:
    name: "Stage 9: Push Docker Images"
    runs-on: ubuntu-latest
    needs: [image-scan, dast-zap]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Docker Image
        run: docker load -i books-pens.tar

      - name: Verify Loaded Images
        run: docker images

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Docker Images
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}:latest
