name: DevSecOps Pipeline - Books-Pens (Production)

on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "*.md"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do?"
        required: true
        default: "scan-only"
        type: choice
        options:
          - scan-only
          - deploy
          - test

env:
  ECR_REPOSITORY_NAME: books-pens
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/books-pens
  EKS_CLUSTER_NAME: books-cluster
  IMAGE_TAG: v${{ github.run_number }}
  APP_PORT: 3000 # port your container listens on (used by ZAP DAST stage)

permissions:
  id-token: write
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ═══════════════════════════════════════════════════════
  # STAGE 1: SECRET SCANNING — GITLEAKS
  # ═══════════════════════════════════════════════════════
  secret-scan:
    name: "Stage 1: Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════
  # STAGE 2: LINTING
  # ═══════════════════════════════════════════════════════
  lint:
    name: "Stage 2: Linting (ESLint)"
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ═══════════════════════════════════════════════════════
  # STAGE 3: SAST — SEMGREP
  # ═══════════════════════════════════════════════════════
  semgrep:
    name: "Stage 3: SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python (for Semgrep)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install --no-cache-dir semgrep

      - name: Run Semgrep scan (SARIF)
        # --error exits 1 on findings, 0 on no-findings, 2 on crash.
        # We append || true so the workflow continues and SARIF is uploaded
        # instead of failing the job before upload. Severity gating is done
        # via the Security tab / code-scanning alerts.
        run: semgrep scan --config auto --sarif --output semgrep.sarif --error || true

      - name: Verify SARIF exists
        if: always()
        run: |
          echo "Checking for semgrep.sarif..."
          ls -lh semgrep.sarif || echo "::warning::semgrep.sarif not created by scan"
          # Guard: create minimal valid SARIF if somehow missing so upload never crashes
          if [ ! -f semgrep.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Semgrep","informationUri":"https://semgrep.dev"}},"results":[]}]}' > semgrep.sarif
            echo "Created empty fallback SARIF"
          fi
          head -n 50 semgrep.sarif || cat semgrep.sarif

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep
          wait-for-processing: true

  # ═══════════════════════════════════════════════════════
  # STAGE 4: DEPENDENCY SCAN — SCA
  # ═══════════════════════════════════════════════════════
  dependency-scan:
    name: "Stage 4: Dependency Scan (Trivy FS)"
    runs-on: ubuntu-latest
    needs: [semgrep]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan - src
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "./src"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  # ═══════════════════════════════════════════════════════
  # STAGE 5: BUILD DOCKER IMAGE
  # ═══════════════════════════════════════════════════════
  build-image:
    name: "Stage 5: Build Docker Image"
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Built Images
        run: docker images

      - name: Save Docker Image
        run: |
          docker save \
            -o books-pens.tar \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.IMAGE_NAME }}:latest

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: books-pens.tar
          retention-days: 1

  # ═══════════════════════════════════════════════════════
  # STAGE 6: CONTAINER IMAGE SCAN
  # ═══════════════════════════════════════════════════════
  image-scan:
    name: "Stage 6: Container Image Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [build-image]
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Docker Image
        run: docker load -i books-pens.tar

      - name: Verify Loaded Images
        run: docker images

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: "sarif"
          output: "trivy-image.sarif"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          scanners: "vuln"

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-image.sarif"
          category: "trivy-image"
          wait-for-processing: true

  # ═══════════════════════════════════════════════════════
  # STAGE 7: DAST — OWASP ZAP BASELINE SCAN
  # Runs the freshly built image locally and scans it
  # ═══════════════════════════════════════════════════════
  dast-zap:
    name: "Stage 7: DAST (OWASP ZAP)"
    runs-on: ubuntu-latest
    needs: [image-scan]
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Docker Image
        run: docker load -i books-pens.tar

      - name: Start application container
        run: |
          docker run -d --name books-pens-app \
            -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Wait for application to be ready
        run: |
          echo "Waiting for http://localhost:${APP_PORT} ..."
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" "http://localhost:${APP_PORT}" | grep -qE "^(2|3|4)[0-9]{2}$"; then
              echo "Application is up (attempt $i)"
              exit 0
            fi
            sleep 3
          done
          echo "::error::Application did not become ready in time"
          docker logs books-pens-app
          exit 1

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:${{ env.APP_PORT }}"
          # Optional: commit a .zap/rules.tsv to tune/ignore specific alerts
          # rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a" # also include alpha passive rules
          allow_issue_writing: false # don't auto-create GitHub issues
          fail_action: false # set to true to fail the pipeline on ZAP warnings/failures
          artifact_name: "zap-report"

      - name: Add ZAP summary to job summary
        if: always()
        run: |
          if [ -f report_md.md ]; then
            echo "## OWASP ZAP Baseline Report" >> "$GITHUB_STEP_SUMMARY"
            cat report_md.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::report_md.md not found"
          fi

      - name: Upload ZAP reports (HTML / JSON / MD)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports-all-formats
          path: |
            report_html.html
            report_json.json
            report_md.md
          if-no-files-found: warn
          retention-days: 14

      - name: Show app logs on failure
        if: failure()
        run: docker logs books-pens-app || true

      - name: Stop application container
        if: always()
        run: docker rm -f books-pens-app || true

  # ═══════════════════════════════════════════════════════
  # STAGE 8: SBOM GENERATION — SYFT (CycloneDX)
  # ═══════════════════════════════════════════════════════
  sbom-generation:
    name: "Stage 8: Generate SBOM"
    runs-on: ubuntu-latest
    needs: [build-image]

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.20.6

      - name: Generate SBOM
        run: |
          syft dir:. \
            --exclude './.github/**' \
            -o cyclonedx-json=sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: application-sbom
          path: sbom.json
          retention-days: 30

  # ═══════════════════════════════════════════════════════
  # STAGE 9: SBOM VULNERABILITY SCAN — GRYPE
  # ═══════════════════════════════════════════════════════
  sbom-scan:
    name: "Stage 9: SBOM Vulnerability Scan (Grype)"
    runs-on: ubuntu-latest
    needs: [sbom-generation]

    steps:
      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: application-sbom

      - name: Install Grype
        id: grype
        uses: anchore/scan-action/download-grype@v6

      - name: Scan SBOM
        # download-grype doesn't add grype to PATH; use the path it outputs
        run: |
          # Accepted risk: proxy-addr critical finding ignored for now.
          # TODO: remove once proxy-addr is upgraded to >= 2.0.8
          cat > .grype.yaml << 'GRYPE_EOF'
          ignore:
            - vulnerability: GHSA-jqcg-44mw-7w3h
              package:
                name: proxy-addr
                type: npm
          GRYPE_EOF

          ${{ steps.grype.outputs.cmd }} sbom:sbom.json \
            -c .grype.yaml \
            --fail-on high \
            -o table

  # ═══════════════════════════════════════════════════════
  # STAGE 10: PUSH TO DOCKER HUB
  # ═══════════════════════════════════════════════════════
  push-to-dockerhub:
    name: "Stage 10: Push Docker Images"
    runs-on: ubuntu-latest
    needs: [image-scan, dast-zap, sbom-generation, sbom-scan]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Docker Image
        run: docker load -i books-pens.tar

      - name: Verify Loaded Images
        run: docker images

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Docker Images
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}:latest

  # ═══════════════════════════════════════════════════════
  # STAGE 11: SLACK NOTIFICATION
  # Always runs and reports the result of every stage above
  # ═══════════════════════════════════════════════════════
  slack-notification:
    name: "Stage 11: Slack Notification"
    runs-on: ubuntu-latest
    needs:
      - secret-scan
      - lint
      - semgrep
      - dependency-scan
      - build-image
      - image-scan
      - dast-zap
      - sbom-generation
      - sbom-scan
      - push-to-dockerhub
    # Dependabot runs don't get repo secrets, so skip them
    if: always() && github.actor != 'dependabot[bot]'

    steps:
      - name: Send Slack Notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SECRET_STATUS: ${{ needs.secret-scan.result }}
          LINT_STATUS: ${{ needs.lint.result }}
          SAST_STATUS: ${{ needs.semgrep.result }}
          SCA_STATUS: ${{ needs.dependency-scan.result }}
          BUILD_STATUS: ${{ needs.build-image.result }}
          IMAGE_SCAN_STATUS: ${{ needs.image-scan.result }}
          DAST_STATUS: ${{ needs.dast-zap.result }}
          SBOM_STATUS: ${{ needs.sbom-generation.result }}
          SBOM_SCAN_STATUS: ${{ needs.sbom-scan.result }}
          PUSH_STATUS: ${{ needs.push-to-dockerhub.result }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
          WORKFLOW: ${{ github.workflow }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
        run: |
          # Push is legitimately skipped on PRs and "scan-only" runs,
          # so "skipped" counts as OK for it (and for dependabot-skipped scans).
          ok_or_skipped() { [[ "$1" == "success" || "$1" == "skipped" ]]; }

          if [[ "$LINT_STATUS" == "success" &&
                "$SCA_STATUS" == "success" &&
                "$BUILD_STATUS" == "success" &&
                "$IMAGE_SCAN_STATUS" == "success" &&
                "$DAST_STATUS" == "success" &&
                "$SBOM_STATUS" == "success" &&
                "$SBOM_SCAN_STATUS" == "success" ]] &&
             ok_or_skipped "$SECRET_STATUS" &&
             ok_or_skipped "$SAST_STATUS" &&
             ok_or_skipped "$PUSH_STATUS"; then
            STATUS="SUCCESS"
            EMOJI=":white_check_mark:"
            COLOR="#2EB67D"
            MESSAGE="All pipeline stages completed successfully."
          else
            STATUS="FAILED"
            EMOJI=":x:"
            COLOR="#E01E5A"
            MESSAGE="One or more pipeline stages failed. Please investigate."
          fi

          jq -n \
            --arg status "$STATUS" \
            --arg emoji "$EMOJI" \
            --arg color "$COLOR" \
            --arg message "$MESSAGE" \
            --arg repo "$REPO" \
            --arg branch "$BRANCH" \
            --arg commit "${COMMIT:0:7}" \
            --arg actor "$ACTOR" \
            --arg workflow "$WORKFLOW" \
            --arg run "$RUN_ID" \
            --arg image "$IMAGE" \
            --arg url "$SERVER_URL/$REPO/actions/runs/$RUN_ID" \
            --arg secret "$SECRET_STATUS" \
            --arg lint "$LINT_STATUS" \
            --arg sast "$SAST_STATUS" \
            --arg sca "$SCA_STATUS" \
            --arg build "$BUILD_STATUS" \
            --arg imgscan "$IMAGE_SCAN_STATUS" \
            --arg dast "$DAST_STATUS" \
            --arg sbom "$SBOM_STATUS" \
            --arg sbomscan "$SBOM_SCAN_STATUS" \
            --arg push "$PUSH_STATUS" \
            '{
              attachments: [{
                color: $color,
                blocks: [
                  {
                    type: "header",
                    text: {
                      type: "plain_text",
                      text: ($emoji + " Books-Pens Pipeline " + $status),
                      emoji: true
                    }
                  },
                  {
                    type: "section",
                    text: {
                      type: "mrkdwn",
                      text: ("*" + $message + "*")
                    }
                  },
                  { type: "divider" },
                  {
                    type: "section",
                    fields: [
                      { type: "mrkdwn", text: ("*Repository:*\n" + $repo) },
                      { type: "mrkdwn", text: ("*Branch:*\n" + $branch) },
                      { type: "mrkdwn", text: ("*Commit:*\n`" + $commit + "`") },
                      { type: "mrkdwn", text: ("*Triggered by:*\n" + $actor) },
                      { type: "mrkdwn", text: ("*Workflow:*\n" + $workflow) },
                      { type: "mrkdwn", text: ("*Image:*\n`" + $image + "`") }
                    ]
                  },
                  { type: "divider" },
                  {
                    type: "section",
                    text: {
                      type: "mrkdwn",
                      text: (
                        "*Pipeline Stage Results*\n\n" +
                        ":key: Secret Scan (Gitleaks): `" + $secret + "`\n" +
                        ":hammer_and_wrench: Lint (ESLint): `" + $lint + "`\n" +
                        ":mag: SAST (Semgrep): `" + $sast + "`\n" +
                        ":package: Dependency Scan (Trivy FS): `" + $sca + "`\n" +
                        ":whale: Docker Build: `" + $build + "`\n" +
                        ":shield: Image Scan (Trivy): `" + $imgscan + "`\n" +
                        ":spider_web: DAST (OWASP ZAP): `" + $dast + "`\n" +
                        ":page_facing_up: SBOM (Syft): `" + $sbom + "`\n" +
                        ":microscope: SBOM Scan (Grype): `" + $sbomscan + "`\n" +
                        ":arrow_up: Docker Hub Push: `" + $push + "`"
                      )
                    }
                  },
                  { type: "divider" },
                  {
                    type: "actions",
                    elements: [{
                      type: "button",
                      text: {
                        type: "plain_text",
                        text: "View GitHub Actions Run",
                        emoji: true
                      },
                      url: $url,
                      style: "primary"
                    }]
                  }
                ]
              }]
            }' > slack-payload.json

          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data @slack-payload.json \
            "$SLACK_WEBHOOK_URL"
