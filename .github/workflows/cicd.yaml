name: DevSecOps Pipeline - Books-Pens (Production)

on:
  push:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "*.md"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - "terraform/**"
      - "*.md"
  workflow_dispatch:
    inputs:
      action:
        description: "What do you want to do?"
        required: true
        default: "scan-only"
        type: choice
        options:
          - scan-only
          - deploy
          - test

env:
  ECR_REPOSITORY_NAME: books-pens
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/books-pens
  EKS_CLUSTER_NAME: books-cluster
  IMAGE_TAG: v${{ github.run_number }}

permissions:
  id-token: write
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ═══════════════════════════════════════════════════════
  # STAGE 1: SECRET SCANNING
  # ═══════════════════════════════════════════════════════
  secret-scan:
    name: "Stage 1: Secret Scanning (Gitleaks)"
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ═══════════════════════════════════════════════════════
  # STAGE 2: LINTING
  # ═══════════════════════════════════════════════════════
  lint:
    name: "Stage 2: Linting (ESLint)"
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ═══════════════════════════════════════════════════════
  # STAGE 3a: SAST — SEMGREP
  # ═══════════════════════════════════════════════════════
  semgrep:
    name: "Stage 3a: SAST (Semgrep)"
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python (for Semgrep)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install --no-cache-dir semgrep

      - name: Run Semgrep scan (SARIF)
        # --error exits 1 on findings, 0 on no-findings, 2 on crash.
        # We append || true so the workflow continues and SARIF is uploaded
        # instead of failing the job before upload. Severity gating is done
        # via the Security tab / code-scanning alerts.
        run: semgrep scan --config auto --sarif --output semgrep.sarif --error || true

      - name: Verify SARIF exists
        if: always()
        run: |
          echo "Checking for semgrep.sarif..."
          ls -lh semgrep.sarif || echo "::warning::semgrep.sarif not created by scan"
          # Guard: create minimal valid SARIF if somehow missing so upload never crashes
          if [ ! -f semgrep.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Semgrep","informationUri":"https://semgrep.dev"}},"results":[]}]}' > semgrep.sarif
            echo "Created empty fallback SARIF"
          fi
          head -n 50 semgrep.sarif || cat semgrep.sarif

      - name: Upload Semgrep SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep
          wait-for-processing: true

  # ═══════════════════════════════════════════════════════
  # STAGE 3b: SAST — CODEQL (runs in parallel with Semgrep)
  # ═══════════════════════════════════════════════════════
  codeql:
    name: "Stage 3b: SAST (CodeQL - ${{ matrix.language }})"
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          # Interpreted languages need no build; autobuild step not required
          build-mode: none

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  # ═══════════════════════════════════════════════════════
  # STAGE 4: DEPENDENCY SCAN — SCA
  # ═══════════════════════════════════════════════════════
  dependency-scan:
    name: "Stage 4: Dependency Scan (Trivy FS)"
    runs-on: ubuntu-latest
    needs: [semgrep, codeql]
    # Dependabot skips the SAST jobs; still run SCA for its PRs
    if: always() && !cancelled() && !contains(needs.*.result, 'failure')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trivy Filesystem Scan - src
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "./src"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

  # ═══════════════════════════════════════════════════════
  # STAGE 5: BUILD DOCKER IMAGE
  # ═══════════════════════════════════════════════════════
  build-image:
    name: "Stage 5: Build Docker Image"
    runs-on: ubuntu-latest
    needs: [dependency-scan]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Built Images
        run: docker images

      - name: Save Docker Image
        run: |
          docker save \
            -o books-pens.tar \
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ${{ env.IMAGE_NAME }}:latest

      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images
          path: books-pens.tar
          retention-days: 1

  # ═══════════════════════════════════════════════════════
  # STAGE 6: CONTAINER IMAGE SCAN
  # ═══════════════════════════════════════════════════════
  image-scan:
    name: "Stage 6: Container Image Scan (Trivy)"
    runs-on: ubuntu-latest
    needs: [build-image]
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Docker Image
        run: docker load -i books-pens.tar

      - name: Verify Loaded Images
        run: docker images

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}"
          format: "sarif"
          output: "trivy-image.sarif"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          scanners: "vuln"

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: "trivy-image.sarif"
          category: "trivy-image"
          wait-for-processing: true

  # ═══════════════════════════════════════════════════════
  # STAGE 7: PUSH TO DOCKER HUB
  # ═══════════════════════════════════════════════════════
  push-to-dockerhub:
    name: "Stage 7: Push Docker Images"
    runs-on: ubuntu-latest
    needs: [image-scan]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    steps:
      - name: Download Docker Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-images

      - name: Load Docker Image
        run: docker load -i books-pens.tar

      - name: Verify Loaded Images
        run: docker images

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Docker Images
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ env.IMAGE_NAME }}:latest
