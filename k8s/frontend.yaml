
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: books-pens
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: books-pens-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000

          # Readiness Probe
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          # Liveness Probe
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          # Startup Probe
          startupProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: books-pens
spec:
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
